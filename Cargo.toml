[package]
description = "Computational geometry."
edition = "2018"
license = "MIT"
name = "rene"
repository = "https://github.com/lycantropos/rene"
rust-version = "1.74.0"
version = "0.2.0"

[lib]
name = "rene"
crate-type = ["cdylib", "rlib"]

[dependencies]
rithm = "^14.9.0"

[dependencies.traiter]
version = "^4.0.0"
features = ["numbers"]

[dependencies.pyo3]
version = "^0.29.2"
features = ["extension-module"]
optional = true

[dependencies.pyo3-ffi]
version = "^0.29.2"
features = ["extension-module"]
optional = true

[build-dependencies]
pyo3-build-config = "^0.29.2"

[features]
python_binding = ["dep:pyo3", "dep:pyo3-ffi"]

[lints.rust]
warnings = "deny"
